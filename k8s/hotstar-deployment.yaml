apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotstar
  namespace: hotstar-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotstar
  template:
    metadata:
      labels:
        app: hotstar
    spec:
      containers:
        - name: hotstar
          image: hotstar-clone:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: hotstar-service
  namespace: hotstar-devsecops
spec:
  type: ClusterIP
  selector:
    app: hotstar
  ports:
    - port: 80
      targetPort: 8080
