apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: hotstar-eks
  region: ap-south-1
  version: "1.37"

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  publicAccessCIDRs:
    - "152.58.0.34/32"

managedNodeGroups:
  - name: hotstar-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
